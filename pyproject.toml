[project]
name = "vectra3d"
version = "0.1.0"
description = "Create, move, and analyze 3D vectors with hand gestures through a webcam."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=1.0.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.11.2",
    "pyvista>=0.49.0",
    "pyvistaqt>=0.13.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra3d"]
